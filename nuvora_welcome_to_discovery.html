<!DOCTYPE html>

                        "surface-container-lowest": "#0e0e0e",
                        "inverse-primary": "#506600",

                        "secondary-fixed-dim": "#c8c6c5",

                        "on-background": "#e5e2e1",
                        "on-primary-fixed-variant": "#3c4d00",

<style>
        .geometric-portal {
            background-image: repeating-linear-gradient(45deg, rgba(204, 255, 0, 0.03) 0px, rgba(204, 255, 0, 0.03) 2px, transparent 2px, transparent 12px), repeating-linear-gradient(135deg, rgba(204, 255, 0, 0.03) 0px, rgba(204, 255, 0, 0.03) 2px, transparent 2px, transparent 12px);
            mask-image: radial-gradient(circle at center, black 10%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 80%);
        }
        
        .glow-button {
            transition: all 0.3s ease;
        }
        .glow-button:hover {
            box-shadow: 0 0 15px rgba(204, 255, 0, 0.3);
            border-color: rgba(204, 255, 0, 0.8);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center relative overflow-hidden">
<!-- Background Portal Effect -->
<div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
<div class="geometric-portal w-full h-full absolute"></div>
<div class="w-[600px] h-[600px] border-[1px] border-primary-container/10 rounded-full absolute animate-[spin_60s_linear_infinite]"></div>
<div class="w-[450px] h-[450px] border-[1px] border-primary-container/20 rounded-full absolute animate-[spin_40s_linear_infinite_reverse]"></div>
<div class="w-[300px] h-[300px] border-[1px] border-primary-container/30 rounded-full absolute animate-[spin_20s_linear_infinite]"></div>
<div class="w-2 h-2 bg-primary-container rounded-full shadow-[0_0_20px_#ccff00] absolute"></div>
</div>
<!-- Main Content Canvas -->
<main class="z-10 w-full max-w-container-max px-gutter md:px-0 relative">
<div class="bg-surface-container/40 backdrop-blur-md border border-white/10 rounded-xl p-8 flex flex-col items-center text-center">
<!-- Brand Mark -->
<div class="mb-stack-lg">
<span class="material-symbols-outlined text-primary-container text-5xl" style="font-variation-settings: 'FILL' 1;">
                    explore
                </span>
</div>
<!-- Typography -->
<h1 class="font-headline-md text-headline-md text-primary mb-stack-sm tracking-tight">
                Welcome to NUVORA, Alex
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-lg">
                Your intelligent journey starts here.
            </p>
<!-- Actions -->
<div class="flex flex-col w-full gap-stack-md mt-stack-md">
<button class="glow-button w-full bg-primary-container/10 border border-primary-container text-primary-container font-label-md text-label-md py-3 rounded-DEFAULT flex items-center justify-center gap-2">
<span>Personalize Discovery</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<button class="w-full bg-transparent border border-white/10 hover:border-white/30 text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md py-3 rounded-DEFAULT">
                    Skip for now
                </button>
</div>
</div>
</main>
<script>
        // Simple entrance animation for the card
        document.addEventListener("DOMContentLoaded", () => {
            const card = document.querySelector('main > div');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-out';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
