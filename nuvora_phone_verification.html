<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NUVORA - Phone Authentication</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ffb4ab",
                        "inverse-surface": "#e5e2e1",
                        "primary": "#ffffff",
                        "outline": "#8e9379",
                        "secondary-container": "#4a4949",
                        "surface-container-highest": "#353535",
                        "on-tertiary-container": "#636565",
                        "on-error": "#690005",
                        "on-secondary": "#313030",
                        "on-tertiary-fixed-variant": "#454747",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "surface-container-low": "#1b1b1c",
                        "primary-fixed-dim": "#abd600",
                        "surface-container-lowest": "#0e0e0e",
                        "inverse-primary": "#506600",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-secondary-fixed-variant": "#474646",
                        "surface-bright": "#393939",
                        "inverse-on-surface": "#303030",
                        "on-surface-variant": "#c4c9ac",
                        "on-secondary-container": "#bab8b7",
                        "on-tertiary": "#2f3131",
                        "surface": "#131313",
                        "background": "#131313",
                        "primary-container": "#c3f400",
                        "on-tertiary-fixed": "#1a1c1c",
                        "on-background": "#e5e2e1",
                        "on-primary-fixed-variant": "#3c4d00",
                        "primary-fixed": "#c3f400",
                        "surface-variant": "#353535",
                        "on-primary-fixed": "#161e00",
                        "tertiary-container": "#e2e2e2",
                        "on-primary": "#283500",
                        "surface-dim": "#131313",
                        "outline-variant": "#444933",
                        "secondary-fixed": "#e5e2e1",
                        "on-primary-container": "#556d00",
                        "surface-tint": "#abd600",
                        "surface-container": "#202020",
                        "on-secondary-fixed": "#1c1b1b",
                        "surface-container-high": "#2a2a2a",
                        "secondary": "#c8c6c5",
                        "tertiary-fixed": "#e2e2e2",
                        "on-surface": "#e5e2e1",
                        "tertiary": "#ffffff",
                        "error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container-max": "480px",
                        "gutter": "1.5rem",
                        "otp-gap": "0.75rem",
                        "stack-md": "1rem",
                        "stack-lg": "2rem",
                        "stack-sm": "0.5rem"
                    },
                    "fontFamily": {
                        "label-md": ["Manrope"],
                        "label-sm": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "headline-sm": ["Sora"],
                        "headline-md": ["Sora"],
                        "mono-auth": ["Sora"],
                        "display-lg": ["Sora"],
                        "body-md": ["Manrope"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-sm": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-md": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "mono-auth": ["24px", { "lineHeight": "32px", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .input-glow:focus {
            box-shadow: 0 0 0 2px rgba(204, 255, 0, 0.2);
        }
        .otp-input {
            aspect-ratio: 1 / 1;
        }
        .glass-panel {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-5 relative overflow-hidden">
<!-- Abstract Portal Background -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none flex items-center justify-center">
<svg class="w-full h-full max-w-4xl" fill="none" viewbox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
<circle class="animate-[spin_60s_linear_infinite]" cx="400" cy="400" r="300" stroke="#CCFF00" stroke-dasharray="4 8" stroke-width="1"></circle>
<circle cx="400" cy="400" r="200" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"></circle>
<circle class="animate-[pulse_4s_ease-in-out_infinite]" cx="400" cy="400" r="100" stroke="#CCFF00" stroke-opacity="0.2" stroke-width="2"></circle>
</svg>
</div>
<!-- Main Auth Card -->
<main class="w-full max-w-[480px] bg-surface-container border border-white/10 rounded-xl p-8 relative z-10 shadow-2xl flex flex-col gap-stack-lg">
<!-- Header -->
<header class="text-center">
<h1 class="font-headline-md text-headline-md text-primary mb-2">NUVORA</h1>
<h2 class="font-headline-sm text-headline-sm text-on-surface-variant">Verifying identity</h2>
</header>
<!-- Step 1: Phone Entry (Simulated visually as completed or primary state) -->
<section class="hidden flex-col gap-stack-sm" id="step-phone">
<label class="font-label-md text-label-md text-on-surface-variant">Phone Number</label>
<div class="flex gap-2">
<div class="relative w-1/3">
<select class="w-full bg-[#1E1E1E] border border-white/10 rounded focus:border-primary-container focus:ring-0 input-glow text-primary font-body-md text-body-md p-3 appearance-none">
<option>+1 (US)</option>
<option>+44 (UK)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
<input class="w-2/3 bg-[#1E1E1E] border border-white/10 rounded focus:border-primary-container focus:ring-0 input-glow text-primary font-body-md text-body-md p-3 transition-colors" placeholder="(555) 000-0000" type="tel"/>
</div>
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-3 rounded mt-4 hover:bg-surface-tint transition-colors" onclick="toggleSteps()">Send Code</button>
</section>
<!-- Step 2: OTP Entry (Active State) -->
<section class="flex flex-col gap-stack-lg" id="step-otp">
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant mb-1">Enter the 6-digit code sent to</p>
<p class="font-label-md text-label-md text-primary">+1 (555) 019-2834</p>
</div>
<div class="flex justify-between gap-otp-gap" id="otp-container">
<input class="otp-input w-full bg-[#1E1E1E] border border-white/10 rounded focus:border-primary-container focus:ring-0 input-glow text-center font-mono-auth text-mono-auth text-primary transition-colors" maxlength="1" type="text"/>
<input class="otp-input w-full bg-[#1E1E1E] border border-white/10 rounded focus:border-primary-container focus:ring-0 input-glow text-center font-mono-auth text-mono-auth text-primary transition-colors" maxlength="1" type="text"/>
<input class="otp-input w-full bg-[#1E1E1E] border border-white/10 rounded focus:border-primary-container focus:ring-0 input-glow text-center font-mono-auth text-mono-auth text-primary transition-colors" maxlength="1" type="text"/>
<input class="otp-input w-full bg-[#1E1E1E] border border-white/10 rounded focus:border-primary-container focus:ring-0 input-glow text-center font-mono-auth text-mono-auth text-primary transition-colors" maxlength="1" type="text"/>
<input class="otp-input w-full bg-[#1E1E1E] border border-white/10 rounded focus:border-primary-container focus:ring-0 input-glow text-center font-mono-auth text-mono-auth text-primary transition-colors" maxlength="1" type="text"/>
<input class="otp-input w-full bg-[#1E1E1E] border border-white/10 rounded focus:border-primary-container focus:ring-0 input-glow text-center font-mono-auth text-mono-auth text-primary transition-colors" maxlength="1" type="text"/>
</div>
<div class="text-center font-label-sm text-label-sm">
<span class="text-on-surface-variant">Didn't receive code? </span>
<span class="text-primary-container ml-1" id="timer">Resend in 00:45</span>
</div>
<!-- Success State Simulation Button (Hidden in production) -->
<button class="w-full bg-surface-container-highest text-on-background font-label-md text-label-md py-3 rounded mt-2 hover:bg-surface-bright transition-colors border border-white/5" onclick="showSuccess()">Simulate Success</button>
</section>
<!-- Success State overlay -->
<div class="absolute inset-0 glass-panel rounded-xl flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500 z-20" id="success-overlay">
<div class="w-16 h-16 rounded-full border-2 border-primary-container flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary-container" style="font-size: 32px;">check</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-primary">Phone Verified</h3>
</div>
</main>
<script>
        // Simple input auto-advance
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if(e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if(e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Toggle sections for demo purposes
        function toggleSteps() {
            document.getElementById('step-phone').classList.add('hidden');
            document.getElementById('step-phone').classList.remove('flex');
            document.getElementById('step-otp').classList.remove('hidden');
            document.getElementById('step-otp').classList.add('flex');
        }

        // Show success state
        function showSuccess() {
            const overlay = document.getElementById('success-overlay');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100');
        }
    </script>
</body></html>
