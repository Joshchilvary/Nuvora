<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NUVORA | Register</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ffb4ab",
                        "inverse-surface": "#e5e2e1",
                        "primary": "#ffffff",
                        "outline": "#8e9379",
                        "secondary-container": "#4a4949",
                        "surface-container-highest": "#353535",
                        "on-tertiary-container": "#636565",
                        "on-error": "#690005",
                        "on-secondary": "#313030",
                        "on-tertiary-fixed-variant": "#454747",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "surface-container-low": "#1b1b1c",
                        "primary-fixed-dim": "#abd600",
                        "surface-container-lowest": "#0e0e0e",
                        "inverse-primary": "#506600",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-secondary-fixed-variant": "#474646",
                        "surface-bright": "#393939",
                        "inverse-on-surface": "#303030",
                        "on-surface-variant": "#c4c9ac",
                        "on-secondary-container": "#bab8b7",
                        "on-tertiary": "#2f3131",
                        "surface": "#131313",
                        "background": "#131313",
                        "primary-container": "#c3f400",
                        "on-tertiary-fixed": "#1a1c1c",
                        "on-background": "#e5e2e1",
                        "on-primary-fixed-variant": "#3c4d00",
                        "primary-fixed": "#c3f400",
                        "surface-variant": "#353535",
                        "on-primary-fixed": "#161e00",
                        "tertiary-container": "#e2e2e2",
                        "on-primary": "#283500",
                        "surface-dim": "#131313",
                        "outline-variant": "#444933",
                        "secondary-fixed": "#e5e2e1",
                        "on-primary-container": "#556d00",
                        "surface-tint": "#abd600",
                        "surface-container": "#202020",
                        "on-secondary-fixed": "#1c1b1b",
                        "surface-container-high": "#2a2a2a",
                        "secondary": "#c8c6c5",
                        "tertiary-fixed": "#e2e2e2",
                        "on-surface": "#e5e2e1",
                        "tertiary": "#ffffff",
                        "error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container-max": "480px",
                        "gutter": "1.5rem",
                        "otp-gap": "0.75rem",
                        "stack-md": "1rem",
                        "stack-lg": "2rem",
                        "stack-sm": "0.5rem"
                    },
                    "fontFamily": {
                        "label-md": ["Manrope"],
                        "label-sm": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "headline-sm": ["Sora"],
                        "headline-md": ["Sora"],
                        "mono-auth": ["Sora"],
                        "display-lg": ["Sora"],
                        "body-md": ["Manrope"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-sm": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-md": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "mono-auth": ["24px", { "lineHeight": "32px", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .input-glow:focus-within {
            box-shadow: 0 0 0 2px rgba(204, 255, 0, 0.2);
        }
        .glass-card {
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .bg-mesh {
            background-color: #131313;
            background-image: 
                radial-gradient(at 0% 0%, rgba(204, 255, 0, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 255, 255, 0.03) 0px, transparent 50%);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md h-screen w-full flex items-center justify-center bg-mesh overflow-hidden relative">
<div class="w-full max-w-container-max px-5 sm:px-0 relative z-10">
<!-- Logo -->
<div class="flex justify-center mb-stack-lg">
<span class="font-display-lg text-display-lg text-primary tracking-tight">NUVORA</span>
</div>
<!-- Auth Card -->
<div class="glass-card rounded-xl p-8 sm:p-10 w-full shadow-2xl relative overflow-hidden">
<!-- Decorative Light Sweep -->
<div class="absolute inset-0 bg-gradient-to-tr from-transparent via-[rgba(204,255,0,0.02)] to-transparent pointer-events-none"></div>
<div class="mb-stack-lg text-center relative z-10">
<h1 class="font-headline-sm text-headline-sm text-primary mb-2">Join the discovery</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create an account to continue</p>
</div>
<form class="space-y-stack-sm relative z-10">
<!-- Full Name -->
<div class="group relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="fullName">Full Name</label>
<div class="relative input-glow rounded-DEFAULT transition-all duration-300">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant z-10" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full bg-[#1E1E1E] text-primary border border-[#FFFFFF1A] rounded-DEFAULT py-3 pl-10 pr-4 focus:border-primary-container focus:ring-0 transition-colors font-body-md text-body-md hover:border-[#FFFFFF33]" id="fullName" placeholder="Enter your full name" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="group relative mt-stack-md">
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="email">Email Address</label>
<div class="relative input-glow rounded-DEFAULT transition-all duration-300">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant z-10" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-[#1E1E1E] text-primary border border-[#FFFFFF1A] rounded-DEFAULT py-3 pl-10 pr-4 focus:border-primary-container focus:ring-0 transition-colors font-body-md text-body-md hover:border-[#FFFFFF33]" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="group relative mt-stack-md">
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="password">Password</label>
<div class="relative input-glow rounded-DEFAULT transition-all duration-300">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant z-10" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-[#1E1E1E] text-primary border border-[#FFFFFF1A] rounded-DEFAULT py-3 pl-10 pr-10 focus:border-primary-container focus:ring-0 transition-colors font-body-md text-body-md hover:border-[#FFFFFF33]" id="password" placeholder="Create a password" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
<!-- Password Strength -->
<div class="mt-3 flex items-center justify-between gap-2">
<div class="flex gap-1 flex-1 h-1.5 rounded-full overflow-hidden">
<div class="h-full bg-primary-container flex-1"></div>
<div class="h-full bg-primary-container flex-1"></div>
<div class="h-full bg-primary-container flex-1"></div>
<div class="h-full bg-[#353535] flex-1"></div>
</div>
<span class="font-label-sm text-label-sm text-primary-container shrink-0">Strong</span>
</div>
</div>
<!-- Confirm Password -->
<div class="group relative mt-stack-md">
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="confirmPassword">Confirm Password</label>
<div class="relative input-glow rounded-DEFAULT transition-all duration-300">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant z-10" style="font-variation-settings: 'FILL' 0;">lock_clock</span>
<input class="w-full bg-[#1E1E1E] text-primary border border-[#FFFFFF1A] rounded-DEFAULT py-3 pl-10 pr-10 focus:border-primary-container focus:ring-0 transition-colors font-body-md text-body-md hover:border-[#FFFFFF33]" id="confirmPassword" placeholder="Confirm your password" required="" type="password"/>
</div>
</div>
<!-- Terms -->
<div class="flex items-start mt-stack-md pt-2">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-[#FFFFFF1A] bg-[#1E1E1E] text-primary-container focus:ring-primary-container focus:ring-offset-0 focus:ring-offset-[#131313] checked:bg-primary-container checked:border-primary-container cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="ml-2 font-label-sm text-label-sm text-on-surface-variant cursor-pointer" for="terms">
                        I agree to the <a class="text-primary hover:text-primary-container transition-colors underline decoration-[#FFFFFF1A] underline-offset-2" href="#">Terms of Service</a> and <a class="text-primary hover:text-primary-container transition-colors underline decoration-[#FFFFFF1A] underline-offset-2" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Action Button -->
<button class="w-full mt-stack-lg bg-primary text-[#131313] font-label-md text-label-md py-3 px-4 rounded-DEFAULT hover:bg-primary-container transition-all duration-300 transform active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-[#131313]" type="submit">
                    Create Account
                </button>
</form>
<div class="mt-6 text-center relative z-10">
<span class="font-label-sm text-label-sm text-on-surface-variant">Already have an account? </span>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors font-semibold" href="#">Login instead</a>
</div>
</div>
<!-- Footer Navigation (Suppressed per rules for auth screens, keeping empty placeholder to acknowledge structure) -->
</div>
<script>
        // Micro-interaction for password visibility
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                }
            });
        });
    </script>
</body></html>
