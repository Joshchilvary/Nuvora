<style>
        .glass-panel {
            background: rgba(40, 42, 47, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(195, 201, 176, 0.1);
        }
        
        .glass-panel-floating {
            background: rgba(40, 42, 47, 0.6);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(195, 201, 176, 0.15);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .glow-effect {
            box-shadow: 0 0 40px rgba(184, 243, 74, 0.1);
        }

        .inner-glow {
            box-shadow: inset 0 0 15px rgba(184, 243, 74, 0.05);
        }

        /* Abstract space animation elements */
        .orb-1 {
            animation: float-1 8s ease-in-out infinite;
            filter: blur(40px);
        }
        .orb-2 {
            animation: float-2 12s ease-in-out infinite reverse;
            filter: blur(60px);
        }
        
        @keyframes float-1 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            50% { transform: translate(-30px, 20px) scale(1.1); opacity: 0.5; }
        }
        
        @keyframes float-2 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            50% { transform: translate(40px, -30px) scale(0.9); opacity: 0.4; }
        }

        /* Subtle checkmark animation */
        .check-anim {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCheck 1s cubic-bezier(0.65, 0, 0.45, 1) forwards 0.5s;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }
        
        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUpAnim 0.8s ease-out forwards;
        }
        
        @keyframes fadeUpAnim {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
    </style>
